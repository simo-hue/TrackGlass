name: Trackglass
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  TrackglassKit:
    path: Packages/TrackglassKit
  TrackglassEngine:
    path: Packages/TrackglassEngine
targets:
  TrackglassiOS:
    type: application
    platform: iOS
    sources:
      - iOS/App
    dependencies:
      - package: TrackglassKit
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    info:
      path: iOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(TG_PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TGProductName: $(TG_PRODUCT_NAME)
        TGBundlePrefix: $(TG_BUNDLE_PREFIX)
        TGWebsiteURL: $(TG_WEBSITE_URL)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    scheme:
      gatherCoverageData: false
      testTargets:
        - TrackglassiOSTests
  TrackglassMac:
    type: application
    platform: macOS
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Mac/Injection/Quartz/PrivateAPI/TGPrivateAPI.h
    sources:
      - Mac/Injection/Quartz/PrivateAPI
      - Mac/App
    dependencies:
      - package: TrackglassKit
      - package: TrackglassEngine
    configFiles:
      Debug: Config/Mac.xcconfig
      Release: Config/Mac.xcconfig
    info:
      path: Mac/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(TG_PRODUCT_NAME) for Mac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TGProductName: $(TG_PRODUCT_NAME)
        TGBundlePrefix: $(TG_BUNDLE_PREFIX)
        TGWebsiteURL: $(TG_WEBSITE_URL)
        LSUIElement: true
    scheme:
      gatherCoverageData: false
      testTargets:
        - TrackglassMacTests
  TrackglassiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/TrackglassiOSTests
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TG_BUNDLE_PREFIX).ios.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TrackglassiOS
  TrackglassMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TrackglassMacTests
    configFiles:
      Debug: Config/Mac.xcconfig
      Release: Config/Mac.xcconfig
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Mac/Injection/Quartz/PrivateAPI/TGPrivateAPI.h
        PRODUCT_BUNDLE_IDENTIFIER: $(TG_BUNDLE_PREFIX).mac.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TrackglassMac
  tgreplay:
    type: tool
    platform: macOS
    sources:
      - Tools/tgreplay
    dependencies:
      - package: TrackglassKit
      - package: TrackglassEngine
    scheme: {}
  tgaccel:
    type: tool
    platform: macOS
    sources:
      - Tools/tgaccel
    scheme: {}
