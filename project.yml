name: Trackglass
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  TrackglassiOS:
    type: application
    platform: iOS
    sources:
      - iOS/App
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    info:
      path: iOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(TG_PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TGProductName: $(TG_PRODUCT_NAME)
        TGBundlePrefix: $(TG_BUNDLE_PREFIX)
        TGWebsiteURL: $(TG_WEBSITE_URL)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    scheme:
      gatherCoverageData: false
  TrackglassMac:
    type: application
    platform: macOS
    sources:
      - Mac/App
    configFiles:
      Debug: Config/Mac.xcconfig
      Release: Config/Mac.xcconfig
    info:
      path: Mac/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(TG_PRODUCT_NAME) for Mac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TGProductName: $(TG_PRODUCT_NAME)
        TGBundlePrefix: $(TG_BUNDLE_PREFIX)
        TGWebsiteURL: $(TG_WEBSITE_URL)
        LSUIElement: true
    scheme:
      gatherCoverageData: false
