name: Trackglass
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  TrackglassKit:
    path: Packages/TrackglassKit
  TrackglassEngine:
    path: Packages/TrackglassEngine
targets:
  TrackglassiOS:
    type: application
    platform: iOS
    sources:
      - iOS/App
      - iOS/Surface
      - iOS/Networking
      - iOS/Pairing
      - iOS/Resources/Assets.xcassets
    dependencies:
      - package: TrackglassKit
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(TG_PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TGProductName: $(TG_PRODUCT_NAME)
        TGBundlePrefix: $(TG_BUNDLE_PREFIX)
        NSLocalNetworkUsageDescription: Trackglass finds and talks to Trackglass for Mac on your local network.
        NSBonjourServices:
          - _trackglass._tcp
          - _trackglass._udp
        TGWebsiteURL: $(TG_WEBSITE_URL)
        TGRepoURL: $(TG_REPO_URL)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: $(TG_BUNDLE_PREFIX).pairing
            CFBundleURLSchemes:
              - trackglass
        NSCameraUsageDescription: Scan the pairing code shown by Trackglass for Mac.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    scheme:
      gatherCoverageData: false
      testTargets:
        - TrackglassiOSTests
  TrackglassMac:
    type: application
    platform: macOS
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Mac/Injection/Quartz/PrivateAPI/TGPrivateAPI.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - Mac/App
      - Mac/Networking
      - Mac/Pairing
      - Mac/Settings
      - Mac/Injection
      - Mac/Resources/Assets.xcassets
      - path: Mac/Resources/DefaultAccelCurves.json
        buildPhase: resources
    dependencies:
      - package: TrackglassKit
      - package: TrackglassEngine
    configFiles:
      Debug: Config/Mac.xcconfig
      Release: Config/Mac.xcconfig
    entitlements:
      path: Mac/Resources/TrackglassMac.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    info:
      path: Mac/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(TG_PRODUCT_NAME) for Mac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TGProductName: $(TG_PRODUCT_NAME)
        TGBundlePrefix: $(TG_BUNDLE_PREFIX)
        NSLocalNetworkUsageDescription: Trackglass finds and talks to Trackglass for Mac on your local network.
        NSBonjourServices:
          - _trackglass._tcp
          - _trackglass._udp
        TGWebsiteURL: $(TG_WEBSITE_URL)
        TGRepoURL: $(TG_REPO_URL)
        LSUIElement: true
    scheme:
      gatherCoverageData: false
      testTargets:
        - TrackglassMacTests
  TrackglassiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/TrackglassiOSTests
      - Tests/Shared
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TG_BUNDLE_PREFIX).ios.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TrackglassiOS
  TrackglassiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/TrackglassiOSUITests
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TG_BUNDLE_PREFIX).ios.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TrackglassiOS
  TrackglassMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TrackglassMacTests
      - iOS/Networking/PairingClient.swift
      - iOS/Networking/SessionClient.swift
      - iOS/Surface/UDPFrameSink.swift
      - iOS/Surface/FrameSink.swift
      - Tests/Shared
    configFiles:
      Debug: Config/Mac.xcconfig
      Release: Config/Mac.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TG_BUNDLE_PREFIX).mac.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Mac/Injection/Quartz/PrivateAPI/TGPrivateAPI.h
    dependencies:
      - target: TrackglassMac
  tgreplay:
    type: tool
    platform: macOS
    sources:
      - Tools/tgreplay
    dependencies:
      - package: TrackglassKit
      - package: TrackglassEngine
    scheme: {}
  tgaccel:
    type: tool
    platform: macOS
    sources:
      - Tools/tgaccel
    scheme: {}
schemes:
  TrackglassiOSSoak:
    build:
      targets:
        TrackglassiOS: all
        TrackglassiOSUITests: [test]
    test:
      targets:
        - TrackglassiOSUITests
      environmentVariables:
        TG_SOAK_SECONDS: $(TG_SOAK_SECONDS)
