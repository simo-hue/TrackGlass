name: CI

# The owner's verification (Scripts/ci.sh) on a hosted macOS runner, unsigned: package tests, iOS simulator
# tests, both app builds, fixture replay and loss invariants. The Mac-hosted test bundle and the Keychain-backed
# iOS PairingStoreTests need a signed host (data-protection Keychain), so they run only on the release Mac,
# as do device tests and notarization.
on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "docs/**", "*.md", "Design/**"]
  pull_request:
    paths-ignore: ["website/**", "docs/**", "*.md", "Design/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a superseded pull-request run is cancelled; a running push build on main finishes (GitHub may still replace a
  # push run that is only queued with a newer one).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Needs the Xcode that ships the iOS 17+ SDK with Swift 6; pick the newest image GitHub offers.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TG_CI_UNSIGNED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # The newest GA Xcode, never a beta or release candidate: the packages build with -warnings-as-errors,
        # so a prerelease compiler's new warnings would turn main red for reasons unrelated to the change.
        run: |
          XCODE="$(printf '%s\n' /Applications/Xcode_*.app | grep -viE 'beta|release[_ -]?candidate|_rc' | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then echo "no GA Xcode on this runner:"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Local signing placeholder
        run: cp Config/Local.xcconfig.example Config/Local.xcconfig
      - name: Generate project
        run: xcodegen generate
      - name: Pick an installed iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)?' | sort -V | tail -1)
          echo "destination=platform=iOS Simulator,name=${NAME:-iPhone 17}" >> "$GITHUB_OUTPUT"
          echo "using ${NAME:-iPhone 17}"
      - name: Verify
        env:
          TG_IOS_TEST_DESTINATION: ${{ steps.sim.outputs.destination }}
        run: Scripts/ci.sh
      - name: Keep test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
